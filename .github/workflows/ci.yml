name: "CI: PR Checks"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  test:
    name: Test
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Test
        run: pnpm test

  build:
    name: Build
    if: github.event.pull_request.draft != true
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Build
        run: pnpm build

  ci-complete:
    name: ci-complete
    needs: [code-quality, test, build]
    if: always()
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Assert no job failed or was cancelled
        run: |
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS" | jq .
          FAILED=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$FAILED" ]; then
            echo "::error::The following checks failed or were cancelled:"
            echo "$FAILED"
            exit 1
          fi
          echo "All checks passed or were legitimately skipped."

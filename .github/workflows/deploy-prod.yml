# Deploys skystream to Coolify on Launchpad. Coolify is Tailscale-only
# (100.x address), so the runner joins the tailnet with an ephemeral,
# tag-scoped auth key before calling Coolify's deploy API. Coolify then pulls
# main and rebuilds the Dockerfile itself — this workflow only triggers it.
#
# Manual deploy / rollback: Actions -> "Deploy: Web (prod)" -> Run workflow
# (or `coolify deploy $COOLIFY_APP_UUID` from any tailnet machine).
#
# Required config:
#   secret  TS_AUTHKEY          — Tailscale ephemeral auth key, tag:ci-deploy
#   secret  COOLIFY_API_TOKEN   — Coolify API token (Bearer)
#   var     COOLIFY_URL         — e.g. http://100.122.178.53:8000
#   var     COOLIFY_APP_UUID    — the skystream app uuid
name: "Deploy: Web (prod)"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-skystream-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → production (Coolify)
    runs-on: ${{ vars.RUNNER }}
    environment: production
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          version: latest

      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            --request GET "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}")
          echo "HTTP ${code}"
          cat /tmp/resp; echo
          if [ "$code" -ge 300 ]; then
            echo "::error::Coolify deploy trigger failed (HTTP ${code})"
            exit 1
          fi
          echo "Deploy queued on Coolify — it will pull main and rebuild the image."
